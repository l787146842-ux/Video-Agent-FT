[pytest]
asyncio_mode = auto
testpaths = tests
# 并行提速（2026-08-26 用户裁决；审查修复批可移植性修订）：
# addopts 只持 --dist loadfile（保同文件用例同 worker，维持模块级共享状态/
# 夹具语义）；并发度由各调用方按机器显式指定，避免硬编码 worker 数随
# addopts 带入核数不同的环境——acceptance/pre-commit 显式 -n 8，
# CI 用 -n auto 自适应。单测确需串行时用 pytest -n 0 覆盖。
# --basetemp 固定仓库内 .pytest_tmp（gitignore 域，2026-09-12 3333 批）：
# 系统 Temp 的 pytest-of-ASUS 残留含提权会话创建的坏 reparse point
# （pytest-current），默认 tmp 根 resolve 即 PermissionError；
# 显式 basetemp 绕开污染域。注意 basetemp 每轮清空，勿指仓库内容目录。
addopts = --dist loadfile --basetemp=.pytest_tmp/run
# 单测试超时护栏（七轮 S4/F5 设立；原 600s 为宽松值，只防死循环）
# 任务 #21（2026-08-22）收紧至 120s：单元测试应在秒级完成，600s 宽值让卡死/悬挂
# 隐身在长超时里拖慢全量回归；收紧后快速暴露卡死。若正常慢测试误伤，
# 先排查测试本身（外部网络/长睡眠/死锁），不放宽护栏。
timeout = 120
markers =
    allow_degradation: 有意触发降级遥测的故障注入测试（豁免劣化即红守卫，批5）
