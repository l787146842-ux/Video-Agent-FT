[pytest]
asyncio_mode = auto
testpaths = tests
# 并行提速（2026-08-26 用户裁决）：xdist -n 8 稳妥值（机器 24 逻辑核，
# 不取 auto 防 Windows 进程数爆炸）；--dist loadfile 保同文件用例同 worker，
# 维持模块级共享状态/夹具语义。acceptance/pre-commit/CI 调用均未显式传 -n，
# 统一从本 addopts 生效；单测确需串行时用 pytest -p no:xdist 或 -n 0 覆盖。
addopts = -n 8 --dist loadfile
# 单测试超时护栏（七轮 S4/F5 设立；原 600s 为宽松值，只防死循环）
# 任务 #21（2026-08-22）收紧至 120s：单元测试应在秒级完成，600s 宽值让卡死/悬挂
# 隐身在长超时里拖慢全量回归；收紧后快速暴露卡死。若正常慢测试误伤，
# 先排查测试本身（外部网络/长睡眠/死锁），不放宽护栏。
timeout = 120
markers =
    allow_degradation: 有意触发降级遥测的故障注入测试（豁免劣化即红守卫，批5）
