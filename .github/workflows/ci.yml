name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------- Job 1: 后端测试（Python 矩阵） ----------
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest (任务 #11：--cov=src/video_agent/core 并入本次运行，免重复全量；审查修复批：-n auto 并行自适应 CI 核数)
        run: python -m pytest tests/ -n auto -q --tb=short --cov=src/video_agent/core --cov-report=xml
      - name: Coverage ratchet gate (任务 #11：core 覆盖率棘轮，只升不降)
        run: python scripts/check_cov_ratchet.py --require-xml
      - name: Prompt budget gate (宪法 §13.6：模型可见严禁数量 + system.md 体量)
        run: python scripts/check_prompt_budget.py
      - name: File lines gate (宪法 §5/F58：单文件 1200 行红线)
        run: python scripts/check_file_lines.py
      - name: Frontend file lines gate (P4-23：src/web 物理行数 250 红线 + 白名单棘轮)
        run: python scripts/check_file_lines.py --frontend
      - name: Func-import gate (四轮 R0：方法内 import 防新增，宪法第六章)
        run: python scripts/check_func_imports.py
      - name: Category keys gate (九轮 B2：类别 Key 字面量门禁，CAT_* 单一事实源)
        run: python scripts/check_category_keys.py
      - name: Legacy orchestration gate (0818 B5：退役编排机制防复活)
        run: python scripts/check_legacy_orchestration.py
      - name: Layer imports gate (整改批 3.3：core/tools 禁止反向依赖 web 层)
        run: python scripts/check_layer_imports.py
      - name: Scaffold registry gate (acceptance GATES 对齐：脚手架登记表 + 组件可导入)
        run: python scripts/check_scaffold_registry.py
      - name: Reference integrity gate (文档指针漂移与宪法锚点合并为一条引用完整性闸)
        run: python scripts/check_doc_pointers.py
      # Executor skill drift gate 已随任务#36 B5 执行器一步退役删除（执行器族不复存在）
      # Skill tool names gate 已随批 A 退役删除（2026-08-29 用户裁决删工具名白名单门禁，与 acceptance GATES 14 项对齐）
      - name: Semantic colors gate (影响面审查 FIX-3：styles/*.css 硬编码颜色棘轮，对齐 acceptance GATES)
        run: python scripts/check_semantic_colors.py
      - name: API contract check (OpenAPI + SSE sidecar -> TS types；任务 #4 双产物：api.generated.ts 与 sse.schema.json 同闸校验)
        run: python scripts/gen_api_types.py --check

  # ---------- Job 1b: 后端测试（STATE_BACKEND=sqlite 显式维度，任务 #11 建 / 任务 #18 激活） ----------
  # 与主 pytest job 平行，守护生产默认路径（settings.state_backend 默认 sqlite）：
  # conftest 基线夹具在 STATE_BACKEND 显式设置时跟随 env（任务 #18 / P10 修正，
  # 此前无条件钉 json 使本 job 名存实亡），全量套件真实跑在 sqlite 后端上。
  backend-test-sqlite:
    runs-on: ubuntu-latest
    env:
      STATE_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest (STATE_BACKEND=sqlite；审查修复批：-n auto 并行自适应 CI 核数)
        run: python -m pytest tests/ -n auto -q --tb=short

  # ---------- Job 2: 前端类型检查 + Lint + 单元测试 ----------
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src/web/
      - name: Vitest unit tests
        run: npx vitest run
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontend coverage ratchet gate (影响面审查 FIX-3：整体行覆盖率棘轮，对齐 acceptance GATES)
        run: python scripts/check_fe_cov_ratchet.py --require-summary

  # ---------- Job 3: 构建验证 ----------
  build:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-test-sqlite, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify build output
        run: |
          test -f static/dist/index.html || (echo "Build output missing!" && exit 1)
          ls static/dist/studio-*.js || (echo "JS bundle missing!" && exit 1)
          echo "Build OK: dist/index.html + JS bundle exist"

  # ---------- Job 4: E2E 冒烟（硬门禁：任务 #18 口径对齐，移除 continue-on-error） ----------
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-test-sqlite, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run E2E smoke tests
        run: npx playwright test
      # 任务 #11：失败时留存 trace/截图（retries=1 + trace on-first-retry 的产物），
      # if: always() 保证失败也上传，便于 CI 红后离线复盘
      - name: Upload Playwright trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---------- Job 5: 评测流水线（814E5：黄金语料回归 + Skill 管线可解析性） ----------
  eval-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run eval pipeline
        run: python scripts/run_eval_pipeline.py
