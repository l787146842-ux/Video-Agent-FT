name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------- Job 1: 后端测试（Python 矩阵） ----------
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest (任务 #11：--cov=src/video_agent/core 并入本次运行，免重复全量)
        run: python -m pytest tests/ -q --tb=short --cov=src/video_agent/core --cov-report=xml
      - name: Coverage ratchet gate (任务 #11：core 覆盖率棘轮，只升不降)
        run: python scripts/check_cov_ratchet.py --require-xml
      - name: Prompt budget gate (宪法 §13.6：模型可见严禁数量 + system.md 体量)
        run: python scripts/check_prompt_budget.py
      - name: File lines gate (宪法 §5/F58：单文件 1200 行红线)
        run: python scripts/check_file_lines.py
      - name: Frontend file lines gate (P4-23：src/web 物理行数 250 红线 + 白名单棘轮)
        run: python scripts/check_file_lines.py --frontend
      - name: Func-import gate (四轮 R0：方法内 import 防新增，宪法第六章)
        run: python scripts/check_func_imports.py
      - name: Governance refs gate (七轮 S3/F3：治理叙事标记预算棘轮，宪法 §9 兜底)
        run: python scripts/check_governance_refs.py
      - name: Category keys gate (九轮 B2：类别 Key 字面量门禁，CAT_* 单一事实源)
        run: python scripts/check_category_keys.py
      - name: Legacy orchestration gate (0818 B5：退役编排机制防复活)
        run: python scripts/check_legacy_orchestration.py
      - name: Scaffold registry gate (acceptance GATES 对齐：脚手架登记表 + 组件可导入)
        run: python scripts/check_scaffold_registry.py
      # Executor skill drift gate 已随任务#36 B5 执行器一步退役删除（执行器族不复存在）
      - name: Skill tool names gate (acceptance GATES 对齐：技能文档工具白名单)
        run: python scripts/scan_skills.py --gate
      - name: API contract check (OpenAPI -> TS types)
        run: python scripts/gen_api_types.py --check

  # ---------- Job 1b: 后端测试（STATE_BACKEND=sqlite 显式维度，任务 #11） ----------
  # sqlite 虽是默认后端（P3-16 翻转），此 job 显式钉死环境变量，
  # 防默认值未来漂移时 CI 静默改口径；与矩阵 job 同套件、单 Python 版本控成本。
  backend-test-sqlite:
    runs-on: ubuntu-latest
    env:
      STATE_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest (STATE_BACKEND=sqlite)
        run: python -m pytest tests/ -q --tb=short

  # ---------- Job 2: 前端类型检查 + Lint + 单元测试 ----------
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src/web/
      - name: Vitest unit tests
        run: npx vitest run

  # ---------- Job 3: 构建验证 ----------
  build:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-test-sqlite, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify build output
        run: |
          test -f static/dist/index.html || (echo "Build output missing!" && exit 1)
          ls static/dist/studio-*.js || (echo "JS bundle missing!" && exit 1)
          echo "Build OK: dist/index.html + JS bundle exist"

  # ---------- Job 4: E2E 冒烟（硬门禁：任务 #18 口径对齐，移除 continue-on-error） ----------
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-test-sqlite, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run E2E smoke tests
        run: npx playwright test

  # ---------- Job 5: 评测流水线（814E5：黄金语料回归 + Skill 管线可解析性） ----------
  eval-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run eval pipeline
        run: python scripts/run_eval_pipeline.py
