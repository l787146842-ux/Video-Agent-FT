<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>Flova Studio - 影视 AI 创作工作台</title>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.07.15.1784204264"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.15.1784204260"></script>
    <script src="/static/js/theme.js?v=2026.07.15.1784204243"></script>
    <script src="/static/js/i18n.js?v=2026.07.15.1784204235"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.15.1784204219">
    <link rel="stylesheet" href="/static/css/studio.css?v=2026.07.15.1784873763">
</head>
<body>
    <!-- Studio Header -->
    <header class="studio-header">
        <div class="studio-brand">
            <img src="/static/images/logo.png" alt="Flova Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'28\' height=\'28\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%233b82f6\' stroke-width=\'2\'><rect x=\'2\' y=\'2\' width=\'20\' height=\'20\' rx=\'4\'/><path d=\'M7 12h10M12 7v10\'/></svg>'">
            <span>Flova Studio</span>
            <span class="text-xs px-2 py-0.5 rounded bg-blue-900/40 text-blue-400 border border-blue-800">AI Film Studio</span>
        </div>

        <nav class="studio-nav-links">
            <a href="/" class="studio-nav-item active">影视 Agent 工作台</a>
            <a href="/static/api-settings.html" class="studio-nav-item">API 配置</a>
        </nav>

        <div class="studio-header-actions">
            <div class="relative" id="projectSwitcher">
                <button id="projectInfoBtn" class="btn-secondary text-xs px-3 py-1.5 flex items-center gap-1.5" onclick="toggleProjectMenu()">
                    <i data-lucide="folder-open" class="w-3.5 h-3.5"></i>
                    <span id="currentProjectName">深空探险三体</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 opacity-50"></i>
                </button>
                <div id="projectMenu" class="hidden absolute right-0 top-full mt-1 w-64 rounded-lg border border-gray-700 bg-gray-800 shadow-xl z-50 py-1">
                    <div id="projectMenuList" class="max-h-60 overflow-y-auto"></div>
                    <div class="border-t border-gray-700 my-1"></div>
                    <button class="w-full text-left px-3 py-2 text-xs text-gray-400 hover:bg-gray-700 hover:text-gray-200 flex items-center gap-2" onclick="createNewProject()">
                        <i data-lucide="plus" class="w-3 h-3"></i> 新建项目
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Three-Column Layout Container -->
    <main class="studio-container" id="studioContainer">
        
        <!-- LEFT COLUMN: Assets & Prompts List -->
        <section class="studio-col col-left" id="colLeft">
            <!-- Top Level Tabs: 故事板 / 未归类素材 -->
            <div class="left-tabs">
                <button class="left-tab-btn active" id="tabStoryboard" onclick="switchLeftTab('storyboard')">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    <span>故事板</span>
                </button>
                <button class="left-tab-btn" id="tabUncategorized" onclick="switchLeftTab('uncategorized')">
                    <i data-lucide="folder-git-2" class="w-4 h-4"></i>
                    <span>未归类素材</span>
                </button>
            </div>

            <!-- Left Panel Content Body -->
            <div class="left-content" id="leftContent">
                
                <!-- STORYBOARD VIEW -->
                <div id="storyboardView" class="space-y-4">
                    <!-- Storyboard Sub Navigation -->
                    <div class="sub-nav">
                        <button class="sub-nav-btn active" id="subKeyElements" onclick="switchSubTab('keyElements')">关键元素</button>
                        <button class="sub-nav-btn" id="subShots" onclick="switchSubTab('shots')">分镜</button>
                        <button class="sub-nav-btn" id="subAudio" onclick="switchSubTab('audio')">音频层</button>
                    </div>

                    <!-- Sub Content Container -->
                    <div id="subCategoryContent">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- UNCATEGORIZED ASSETS VIEW -->
                <div id="uncategorizedView" class="hidden">
                    <div class="uncategorized-header">
                        <span class="text-xs font-semibold text-gray-300">资产库概览</span>
                        <button type="button" class="toggle-switch" id="assetShowAllButton" aria-pressed="false" onclick="toggleShowAllAssets()">
                            <span>只看未绑定</span>
                            <div class="switch-track" id="assetShowAllTrack">
                                <div class="switch-thumb"></div>
                            </div>
                            <span>显示全部</span>
                        </button>
                    </div>

                    <div class="assets-grid" id="assetsGrid">
                        <!-- Assets populated by JS -->
                    </div>
                </div>

            </div>
        </section>

        <!-- VERTICAL SPLITTER 1 (LEFT / MIDDLE) -->
        <div class="splitter-v" id="splitterLeft"></div>

        <!-- MIDDLE COLUMN: Preview & Controls Panel -->
        <section class="studio-col col-middle" id="colMiddle">
            
            <!-- TOP SECTION: Media Preview -->
            <div class="preview-top" id="previewTop">
                <div class="preview-media-viewer" id="previewMediaViewer">
                    <div class="text-center text-gray-500">
                        <i data-lucide="clapperboard" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm">请在左侧选择草稿卡片或分镜预览</p>
                    </div>
                </div>
            </div>

            <!-- HORIZONTAL SPLITTER (MIDDLE TOP / MIDDLE BOTTOM) -->
            <div class="splitter-h" id="splitterPreview"></div>

            <!-- BOTTOM SECTION: Agent-Reasoned Prompts & Parameters -->
            <div class="preview-bottom" id="previewBottom">
                
                <!-- Drag & Drop Reference Asset Zone -->
                <div class="ref-drop-zone" id="refDropZone">
                    <div class="flex items-center gap-2">
                        <i data-lucide="image-plus" class="w-4 h-4 text-blue-400"></i>
                        <span class="text-xs text-gray-300">拖拽/上传素材作为参考输入 (首尾帧 / 风格参考)</span>
                    </div>
                    <div class="ref-thumbs" id="refThumbs">
                        <!-- Reference thumbnails populated dynamically -->
                    </div>
                </div>

                <!-- Prompt Container -->
                <div class="prompt-container">
                    <div class="prompt-header">
                        <div class="prompt-title">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-purple-400"></i>
                            <span id="promptTypeTitle">Agent 推理的提示词</span>
                        </div>
                        <button class="collapse-btn" id="collapsePromptBtn" onclick="toggleCollapsePrompt()">
                            <i data-lucide="chevron-up" class="w-3.5 h-3.5" id="collapseIcon"></i>
                            <span id="collapseText">收缩提示词 (只看画面)</span>
                        </button>
                    </div>

                    <textarea class="prompt-textarea" id="detailedPromptInput" placeholder="Agent 将在此输出推演出的详细提示词..."></textarea>
                </div>

                <!-- Parameter Controls Toolbar -->
                <div class="param-controls-bar" id="paramControlsBar">
                    <!-- Populated dynamically based on draft type (Image / Video / Audio) -->
                </div>

            </div>
        </section>

        <!-- VERTICAL SPLITTER 2 (MIDDLE / RIGHT) -->
        <div class="splitter-v" id="splitterRight"></div>

        <!-- RIGHT COLUMN: Agent Interaction Panel -->
        <section class="studio-col col-right" id="colRight">
            
            <!-- Agent Header -->
            <div class="right-header">
                <div class="agent-title">
                    <i data-lucide="bot" class="w-4 h-4 text-blue-400"></i>
                    <span>编剧 & 导演 Agent</span>
                </div>
                <div class="flex items-center gap-2 text-xs text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>在线推演中</span>
                </div>
            </div>

            <!-- Chat Feed -->
            <div class="chat-feed" id="chatFeed">
                <!-- Messages populated by JS -->
            </div>

            <!-- Bottom Chat Input Box -->
            <div class="chat-input-area">
                <div class="chat-input-toolbar">
                    <select id="agentProviderSelect" title="Agent API 平台"></select>

                    <select id="agentModelSelect" title="Agent 模型" disabled>
                        <option value="">请先选择 API</option>
                    </select>

                    <select id="agentSkillSelect" title="技能加载">
                        <option value="production-agent">制片 Agent</option>
                    </select>

                    <select id="agentAssetSelect" title="绑定的资产库">
                        <option value="all">全项目资产库</option>
                        <option value="bound" selected>仅已绑定素材</option>
                    </select>
                </div>

                <div class="chat-input-box" id="chatInputBox" ondragover="handleChatDragOver(event)" ondragleave="handleChatDragLeave(event)" ondrop="handleChatDrop(event)">
                    <div class="pending-attachments" id="pendingAttachments"></div>
                    <div class="chat-input-row">
                        <button class="input-upload-btn" title="上传参考素材或文档" onclick="triggerChatUpload()">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                        <input type="file" id="chatFileInput" class="hidden" multiple onchange="handleChatFileUpload(event)">
                        
                        <textarea id="chatInput" placeholder="给 Agent 发送指令（如：调整场景1氛围、帮我拆分分镜、生成下个动作...）" onkeydown="handleChatKeyDown(event)"></textarea>
                        
                        <button class="send-btn" id="agentSendBtn" onclick="sendAgentMessage()" title="发送">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="drag-overlay" id="chatDragOverlay">松开以添加文件</div>
                </div>
            </div>

        </section>

    </main>

    <!-- JS Implementation Script -->
    <script src="/static/js/studio.js?v=2026.07.15.1784899386"></script>
</body>
</html>
